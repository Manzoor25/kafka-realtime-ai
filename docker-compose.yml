x-kafka-common: &kafka-common
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_CLEANER_ENABLE: "true"
  KAFKA_HEAP_OPTS: "-Xms384m -Xmx512m"

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  KAFKA_CONSUMER_MODE: "${KAFKA_CONSUMER_MODE:-share}"
  SHARE_GROUP_TRIAGE: "${SHARE_GROUP_TRIAGE:-sg-triage-workers}"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_ACTIVE_ALIAS: "kb_chunks_active"
  AI_PROVIDER: "${AI_PROVIDER:-ollama}"
  OLLAMA_BASE_URL: "http://ollama:11434"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-all-minilm:22m}"
  EMBEDDING_VERSION: "${EMBEDDING_VERSION:-v1}"
  EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-384}"
  CHAT_MODEL: "${CHAT_MODEL:-qwen2.5:0.5b}"
  OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-18.0}"
  LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-4}"
  LLM_BACKOFF_BASE_SECONDS: "${LLM_BACKOFF_BASE_SECONDS:-0.75}"
  LLM_BACKOFF_MAX_SECONDS: "${LLM_BACKOFF_MAX_SECONDS:-8.0}"
  LLM_RATE_LIMIT_RPS: "${LLM_RATE_LIMIT_RPS:-8.0}"
  WATCH_DIR: "/workspace/watched_kb"
  WATCH_POLL_SECONDS: "0.4"
  SCHEMAS_DIR: "/app/schemas"
  SEED_KB_DIR: "/app/data/kb"

services:
  kafka-1:
    image: apache/kafka:4.4.0
    hostname: kafka-1
    container_name: krai-kafka-1
    ports:
      - "19092:19092"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-2:
    image: apache/kafka:4.4.0
    hostname: kafka-2
    container_name: krai-kafka-2
    ports:
      - "19093:19093"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,EXTERNAL://localhost:19093"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-3:
    image: apache/kafka:4.4.0
    hostname: kafka-3
    container_name: krai-kafka-3
    ports:
      - "19094:19094"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,EXTERNAL://localhost:19094"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.4.0
    container_name: krai-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Enabling KIP-932 Share Groups feature on 3-broker Kafka 4.4.0 KRaft cluster..."
        /opt/kafka/bin/kafka-features.sh --bootstrap-server kafka-1:9092 upgrade --feature share.version=1 || true
        echo "Pre-creating _schemas topic for Karapace Schema Registry..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists \
          --topic _schemas --partitions 1 --replication-factor 3 \
          --config cleanup.policy=compact --config min.insync.replicas=2
        echo "Pre-creating triage topic and configuring share group sg-triage-workers..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists \
          --topic support.tickets.created.v1 --partitions 2 --replication-factor 3 \
          --config min.insync.replicas=2
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-1:9092 \
          --entity-type groups --entity-name sg-triage-workers --alter \
          --add-config share.auto.offset.reset=earliest,share.record.lock.duration.ms=20000,share.delivery.count.limit=10 || true
        echo "Kafka cluster initialization complete."

  schema-registry:
    image: ghcr.io/aiven-open/karapace:6.2.4
    hostname: schema-registry
    container_name: krai-schema-registry
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["python3", "-m", "karapace"]
    ports:
      - "8081:8081"
    environment:
      KARAPACE_REGISTRY: "true"
      KARAPACE_REST: "false"
      KARAPACE_ADVERTISED_HOSTNAME: "schema-registry"
      KARAPACE_ADVERTISED_PROTOCOL: "http"
      KARAPACE_BOOTSTRAP_URI: "kafka-1:9092"
      KARAPACE_PORT: "8081"
      KARAPACE_HOST: "0.0.0.0"
      KARAPACE_CLIENT_ID: "karapace-sr-1"
      KARAPACE_GROUP_ID: "karapace-schema-registry"
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_REPLICATION_FACTOR: "3"
      KARAPACE_TOPIC_NAME: "_schemas"
      KARAPACE_COMPATIBILITY: "BACKWARD"
      KARAPACE_LOG_LEVEL: "WARNING"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.2
    hostname: qdrant
    container_name: krai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.40.16
    hostname: ollama
    container_name: krai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.40.16
    container_name: krai-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      AI_PROVIDER: "${AI_PROVIDER:-ollama}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-all-minilm:22m}"
      REEMBED_MODEL: "${REEMBED_MODEL:-nomic-embed-text:v1.5}"
      CHAT_MODEL: "${CHAT_MODEL:-qwen2.5:0.5b}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ "$$AI_PROVIDER" = "ollama" ]; then
          echo "Pulling local Ollama models (no API key required)..."
          ollama pull "$$EMBEDDING_MODEL"
          ollama pull "$$REEMBED_MODEL"
          ollama pull "$$CHAT_MODEL"
          echo "Local Ollama models ready."
        else
          echo "AI_PROVIDER=$$AI_PROVIDER; skipping Ollama model pulls."
        fi

  app-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    image: kafka-realtime-ai:local
    container_name: krai-bootstrap
    depends_on:
      schema-registry:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    environment:
      <<: *app-env
    volumes:
      - watched-kb:/workspace/watched_kb
    command: ["bootstrap"]

  kb-watcher:
    image: kafka-realtime-ai:local
    container_name: krai-kb-watcher
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      METRICS_PORT: "9101"
    volumes:
      - watched-kb:/workspace/watched_kb
    command: ["watcher"]
    restart: unless-stopped

  pii-redactor:
    image: kafka-realtime-ai:local
    container_name: krai-pii-redactor
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      METRICS_PORT: "9102"
    command: ["redactor"]
    restart: unless-stopped

  kb-indexer:
    image: kafka-realtime-ai:local
    container_name: krai-kb-indexer
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      METRICS_PORT: "9103"
    command: ["indexer"]
    restart: unless-stopped

  # 4 Triage Share-Group Workers consuming a 2-partition topic (KIP-932 workers > partitions!)
  agent-triage-1:
    image: kafka-realtime-ai:local
    container_name: krai-agent-triage-1
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_ID: "triage-worker-1"
      METRICS_PORT: "9111"
    command: ["triage"]
    restart: unless-stopped

  agent-triage-2:
    image: kafka-realtime-ai:local
    container_name: krai-agent-triage-2
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_ID: "triage-worker-2"
      METRICS_PORT: "9112"
    command: ["triage"]
    restart: unless-stopped

  agent-triage-3:
    image: kafka-realtime-ai:local
    container_name: krai-agent-triage-3
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_ID: "triage-worker-3"
      METRICS_PORT: "9113"
    command: ["triage"]
    restart: unless-stopped

  agent-triage-4:
    image: kafka-realtime-ai:local
    container_name: krai-agent-triage-4
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_ID: "triage-worker-4"
      METRICS_PORT: "9114"
    command: ["triage"]
    restart: unless-stopped

  agent-tools:
    image: kafka-realtime-ai:local
    container_name: krai-agent-tools
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_ID: "tool-worker-1"
      METRICS_PORT: "9105"
    command: ["tools"]
    restart: unless-stopped

  agent-drafter:
    image: kafka-realtime-ai:local
    container_name: krai-agent-drafter
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_ID: "drafter-worker-1"
      METRICS_PORT: "9106"
    command: ["drafter"]
    restart: unless-stopped

  agent-reviewer:
    image: kafka-realtime-ai:local
    container_name: krai-agent-reviewer
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_ID: "reviewer-worker-1"
      METRICS_PORT: "9107"
    command: ["reviewer"]
    restart: unless-stopped

  audit-cost-exporter:
    image: kafka-realtime-ai:local
    container_name: krai-audit-cost-exporter
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_ID: "audit-cost-exporter-1"
      METRICS_PORT: "9108"
    ports:
      - "9108:9108"
    command: ["audit"]
    restart: unless-stopped

  api:
    image: kafka-realtime-ai:local
    container_name: krai-api
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    volumes:
      - watched-kb:/workspace/watched_kb
    ports:
      - "8000:8000"
    command: ["api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    hostname: prometheus
    container_name: krai-prometheus
    depends_on:
      - api
      - audit-cost-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    hostname: grafana
    container_name: krai-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/pipeline-overview.json"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  qdrant-data:
  ollama-data:
  watched-kb:
  prometheus-data:
  grafana-data:
