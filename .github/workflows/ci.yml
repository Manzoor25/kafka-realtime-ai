name: CI

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-and-integration:
    name: Lint, Unit, Integration & Retrieval Eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff linter
        run: python -m ruff check src tests scripts

      - name: Run unit and hermetic integration tests
        run: python -m pytest tests/unit tests/integration -v -m "not docker_e2e"

      - name: Run retrieval evaluation benchmark (before & after replay switchover)
        run: python scripts/evaluate_retrieval.py --provider local --output-json /tmp/local_eval.json

      - name: Verify all 4 failure demos (in-memory harness)
        run: |
          python scripts/failure_demos/demo_1_llm_outage.py --in-memory --outage-seconds 3
          python scripts/failure_demos/demo_2_kill_worker.py --in-memory
          python scripts/failure_demos/demo_3_duplicate_doc.py --in-memory
          python scripts/failure_demos/demo_4_live_reembed.py --in-memory

  docker-compose-e2e:
    name: 3-Broker Kafka 4.4 KRaft + Ollama + Qdrant E2E
    runs-on: ubuntu-latest
    needs: unit-and-integration
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install host test runner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build and boot 3-broker Kafka 4.4.0 KRaft, Karapace, Qdrant, Ollama, Prometheus & Grafana
        run: |
          docker compose up -d --build
          python scripts/wait_for_stack.py --timeout 420

      - name: Execute live Docker Compose E2E tests
        env:
          RUN_DOCKER_E2E: "1"
        run: python -m pytest tests/integration/test_docker_compose_e2e.py -v -s

      - name: Run live Ollama retrieval evaluation & zero-downtime Kafka replay cutover
        run: |
          python scripts/evaluate_retrieval.py --provider stack --output-json /tmp/ollama_eval.json
          echo "## Measured Containerized Benchmarks (3-Broker Kafka 4.4.0 + Ollama + Qdrant)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ollama_eval.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Measured Freshness Endpoint (/v1/freshness)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS http://localhost:8000/v1/freshness >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run live containerized failure demos (all 4 chaos scenarios on 3-broker stack)
        run: |
          python scripts/failure_demos/demo_3_duplicate_doc.py
          python scripts/failure_demos/demo_4_live_reembed.py --duration-seconds 8 --new-model all-minilm:22m --new-version v3-live
          python scripts/failure_demos/demo_2_kill_worker.py
          python scripts/failure_demos/demo_1_llm_outage.py --outage-seconds 15 --tickets 3

      - name: Dump container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
