global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "krai-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "krai-rag-pipeline"
    static_configs:
      - targets:
          - "kb-watcher:9101"
          - "pii-redactor:9102"
          - "kb-indexer:9103"

  - job_name: "krai-triage-share-group"
    static_configs:
      - targets:
          - "agent-triage-1:9111"
          - "agent-triage-2:9112"
          - "agent-triage-3:9113"
          - "agent-triage-4:9114"

  - job_name: "krai-downstream-agents"
    static_configs:
      - targets:
          - "agent-tools:9105"
          - "agent-drafter:9106"
          - "agent-reviewer:9107"

  - job_name: "krai-audit-cost-exporter"
    static_configs:
      - targets: ["audit-cost-exporter:9108"]
